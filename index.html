<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#145a7a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>High Water: Florida Flooding</title>
</head>
<body>
  <div id="app"></div>
  <div id="top" class="hud">
    <div class="titlebar"><h1 id="placeName">High Water</h1><span id="mode"></span></div>
    <div id="stats"></div>
  </div>
  <div id="zoom" class="hud">
    <button data-zoom="house">House</button>
    <button data-zoom="street" class="on">Street</button>
    <button data-zoom="watershed">Area</button>
    <button data-zoom="region">Region</button>
  </div>
  <div id="note" class="hud"></div>
  <div id="panel" class="hud collapsed">
    <label>Place <select id="placeSel"></select></label>
    <div class="row" style="margin-top:6px"><button id="randomPlace">Random place</button></div>
    <div id="concept"></div>
    <div class="row"><button id="s1">Storm 1</button><button id="s2">Storm 2</button><button id="s3">Storm 3</button><button id="s4">Level 2</button></div>
    <label>Rain <span id="rainV"></span><input id="rain" type="range" min="0" max="6" step="0.1" value="0" /></label>
    <label>Tide <span id="tideV"></span><input id="tide" type="range" min="0" max="3.5" step="0.05" value="1" /></label>
    <label>Lens
      <select id="lens">
        <option value="surface">Normal</option>
        <option value="elevation">Elevation</option>
        <option value="groundwater">Groundwater</option>
        <option value="flow">Flow arrows</option>
        <option value="tide">High tide</option>
        <option value="watershed">Watershed</option>
        <option value="pipes">Pipes</option>
      </select>
    </label>
    <div class="row"><button id="reset">Restart storm</button><button id="sound">Sound: on</button></div>
  </div>
  <div id="replay" class="hud hidden">
    <button id="rpPlay">Pause</button>
    <input id="rpSlider" type="range" min="0" max="0" step="1" value="0" />
    <span id="rpTime"></span>
    <button id="rpExit">Exit</button>
  </div>
  <div id="bottom" class="hud">
    <div id="tools">
    <button data-tool="inspect" class="on">Inspect</button>
    <button data-tool="drain">Drain</button>
    <button data-tool="valve">Valve</button>
    <button data-tool="pump">Pump</button>
    <button data-tool="sewer">Sewer</button>
    <button data-tool="swale">Swale</button>
    <button data-tool="pond">Pond</button>
    <button data-tool="wall">Wall</button>
    <button data-tool="raise">Raise road</button>
    <button data-tool="remove">Remove</button>
  </div>
    <div id="bar"><button id="play" class="primary">Play</button><button id="speed">1x</button><button id="panelToggle">More</button></div>
  </div>
  <div id="tut" class="hud hidden"></div>
  <div id="modal" class="hud hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
