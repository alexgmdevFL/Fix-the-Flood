<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#145a7a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>High Water</title>
</head>
<body>
  <div id="app"></div>
  <div id="top" class="hud">
    <h1>High Water</h1>
    <div id="mode"></div>
    <div id="concept"></div>
    <div id="stats"></div>
  </div>
  <div id="panel" class="hud">
    <div class="row" style="margin-top:0">
      <button id="play">Play</button><button id="speed">1x</button><button id="reset">Reset</button><button id="panelToggle">Hide</button>
    </div>
    <div class="body">
      <div class="row"><button id="s1">Storm 1</button><button id="s2">Storm 2</button></div>
      <label>Rain <span id="rainV"></span><input id="rain" type="range" min="0" max="6" step="0.1" value="0" /></label>
      <label>Tide <span id="tideV"></span><input id="tide" type="range" min="0" max="3.5" step="0.05" value="1" /></label>
      <div class="row"><button id="lens">Elevation lens</button></div>
    </div>
  </div>
  <div id="note" class="hud"></div>
  <div id="tools" class="hud">
    <button data-tool="inspect">Inspect</button>
    <button data-tool="drain" class="on">Drain</button>
    <button data-tool="valve">Check valve</button>
    <button data-tool="pump">Pump</button>
    <button data-tool="remove">Remove</button>
  </div>
  <div id="modal" class="hud hidden"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
